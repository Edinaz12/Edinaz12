<svg width="1000" height="1160" viewBox="0 0 1000 1160" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      @keyframes moveBlob {
        0%, 100% { cx: 380px; }
        50% { cx: 620px; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); }
        100% { transform: translateY(1170px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.35; }
      }
      @keyframes pulseText {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.45; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-blob { animation: moveBlob 18s ease-in-out infinite; }
      .anim-scan { animation: scanline 9s linear infinite; }
      .anim-pulse { animation: pulseGlow 3.2s ease-in-out infinite; }
      .anim-motto { animation: pulseText 2.8s ease-in-out infinite; }
      .anim-cursor { animation: blink 1.1s steps(1) infinite; }
    </style>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>

    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1000" height="1160" fill="#050505"/>
  <rect width="1000" height="1160" fill="url(#grid)"/>

  <circle class="anim-blob" cx="500" cy="140" r="360" fill="url(#blob)"/>

  <!-- SCANLINE -->
  <rect class="anim-scan" x="0" y="-10" width="1000" height="2" fill="#ffffff" opacity="0.08"/>

  <!-- HERO -->
  <text class="anim-pulse" x="500" y="158" text-anchor="middle" filter="url(#glow)" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="6">edinaz</text>
  <text x="500" y="158" text-anchor="middle" fill="#d6d6d6" font-size="92" font-weight="800" letter-spacing="6">edinaz</text>

  <line x1="348" y1="186" x2="652" y2="186" stroke="#ffffff" stroke-width="2" filter="url(#softglow)"/>

  <text x="500" y="226" text-anchor="middle" fill="#7a7a7a" font-family="'Courier New', monospace" font-size="15" letter-spacing="6">C++ DEVELOPER &#8226; SYSTEMS &#8226; FOUNDER OF 3dinaz.com</text>

  <!-- IDENTITY -->
  <text x="500" y="372" text-anchor="middle" fill="#f2f2f2" font-size="40" font-weight="700">Live close to the metal.</text>
  <text x="500" y="414" text-anchor="middle" fill="#8a8a8a" font-family="'Courier New', monospace" font-size="19">C++ &amp; low-level by obsession, web by trade.</text>

  <!-- MOTTO -->
  <text class="anim-motto" x="500" y="512" text-anchor="middle" filter="url(#glow)" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="5">AIMING FOR GREATNESS</text>
  <text x="500" y="512" text-anchor="middle" fill="#cfcfcf" font-size="36" font-weight="800" letter-spacing="5">AIMING FOR GREATNESS</text>

  <!-- 3DINAZ.COM -->
  <text x="500" y="600" text-anchor="middle" fill="#4f4f4f" font-family="'Courier New', monospace" font-size="14" letter-spacing="3">// 3dinaz.com</text>

  <!-- TERMINAL -->
  <rect x="290" y="620" width="420" height="128" rx="18" fill="#0a0a0a" stroke="#1d1d1d" stroke-width="1.5"/>

  <!-- WINDOW BUTTONS -->
  <circle cx="324" cy="650" r="6" fill="#ff5f57"/>
  <circle cx="346" cy="650" r="6" fill="#febc2e"/>
  <circle cx="368" cy="650" r="6" fill="#28c840"/>

  <!-- ONLINE STATUS -->
  <circle cx="636" cy="648" r="5" fill="#28c840" filter="url(#softglow)"/>
  <text x="648" y="653" fill="#6b6b6b" font-family="'Courier New', monospace" font-size="13">online</text>

  <!-- DOMAIN -->
  <text x="500" y="712" text-anchor="middle" font-family="'Courier New', monospace" font-size="46" font-weight="700">
    <tspan fill="#ffffff">3dinaz</tspan>
    <tspan fill="#727272">.com</tspan>
  </text>

  <text x="500" y="788" text-anchor="middle" fill="#7a7a7a" font-family="'Courier New', monospace" font-size="14" letter-spacing="2">Z&#252;rich, Switzerland &#183; web design &amp; hosting</text>

  <!-- STACK MANIFEST -->
  <text x="500" y="858" text-anchor="middle" fill="#4f4f4f" font-family="'Courier New', monospace" font-size="14" letter-spacing="3">// stack</text>

  <rect x="225" y="878" width="550" height="158" rx="14" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1.5"/>

  <g font-family="'Courier New', monospace" font-size="15">
    <text x="252" y="914">
      <tspan fill="#28c840">$</tspan>
      <tspan fill="#9a9a9a"> cat stack.txt</tspan>
    </text>
    <text x="252" y="946">
      <tspan fill="#ffffff">web&#160;&#160;&#160;&#160;&#160;</tspan>
      <tspan fill="#4f4f4f"> &#8594; </tspan>
      <tspan fill="#a8a8a8">react  next  typescript  tailwind  node</tspan>
    </text>
    <text x="252" y="974">
      <tspan fill="#ffffff">hosting</tspan>
      <tspan fill="#4f4f4f"> &#8594; </tspan>
      <tspan fill="#a8a8a8">nginx  linux  cloudflare</tspan>
    </text>
    <text x="252" y="1002">
      <tspan fill="#ffffff">systems</tspan>
      <tspan fill="#4f4f4f"> &#8594; </tspan>
      <tspan fill="#a8a8a8">c++  c  asm  cmake  reverse-engineering</tspan>
    </text>
    <text class="anim-cursor" x="252" y="1024" fill="#28c840">_</text>
  </g>

  <!-- FOOTER -->
  <line x1="350" y1="1090" x2="650" y2="1090" stroke="#1c1c1c" stroke-width="1"/>
  <text x="500" y="1124" text-anchor="middle" fill="#5a5a5a" font-family="'Courier New', monospace" font-size="14" letter-spacing="2">github.com/Edinaz12</text>
</svg>
